# Local Gate 5 only. No remote project linked; no application migrations run.
project_id = "mi-finca-cleanup-gate5-local"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = false
schema_paths = []
[db.seed]
enabled = false
sql_paths = []
[studio]
enabled = false
[realtime]
enabled = false
[storage]
enabled = false
[auth]
enabled = false
site_url = "http://127.0.0.1:3000"
[analytics]
enabled = false
[local_smtp]
enabled = false
[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2
[functions.animal-photo-cleanup]
verify_jwt = false
entrypoint = "./functions/animal-photo-cleanup/index.ts"
