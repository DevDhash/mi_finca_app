name: mi_finca_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  image_picker: ^1.2.1
  uuid: ^4.5.3
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  sqlite3_flutter_libs: ^0.5.42
  supabase_flutter: ^2.15.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.9.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/mi_finca_launcher_icon.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/mi_finca_launcher_icon.png"
  adaptive_icon_foreground_inset: 0

  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"